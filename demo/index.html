  <body>
    <main id="demo">
      <noscript>
        <h1>Pinhole</h1>
        <p>
          A pinhole camera and camera obscura looking at your clip, for Resolume
          Arena and Avenue, as one FFGL effect, SW Pinhole. There is no lens: the
          hole makes the picture by Fresnel diffraction, one pattern per colour
          band, so the picture is sharpest at one hole size and softer either
          side, red softer than blue for small holes, with cos⁴ dark corners. A
          Fresnel zone plate in place of the hole brings one colour sharp in the
          glow of the light it does not focus.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2.
        </p>
        <ul>
          <li><a href="https://github.com/stoatworks-labs/pinhole">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
